# This fixes pbpaste/pbcopy integration in Vim, so yanking to system register works in tmux sessions.
# See: https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard
# Install with brew install reattach-to-user-namespace
set -g default-command "reattach-to-user-namespace -l bash"

set-option -sa terminal-overrides ',xterm-256color:RGB'

# Change prefix from C-b to C-a for less finger-wrecking keystrokes
# Also unloads the C-b keystroke
set -g prefix C-a
unbind C-b

# You want C-a to pass through to other applications as well
bind C-a send-prefix

# This is a delay between prefix and command
set -sg escape-time 1

# By default windows start at index 0
set -g base-index 1

# Prefix-r reloads our tmux config in realtime, and displays a message.
bind r source-file ~/.tmux.conf \; display "tmux config reloaded."

# More logical window-splitting commands
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# open new windows/splits in the same path
bind '"' split-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Prefix-hjkl moves a
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Significantly speed up pane selection
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Better pane resizing, including key repeat
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable the mouse. This makes it easier for others to use my config (scroll and switch panes/tabs)
set -g mouse on
set-option -g history-limit 5000
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"

# Note that xterm-256color on OSX works, but screws up bg-colors in Vim.
set -g default-terminal "screen-256color"

# This fixes Ctrl + arrow key navigation in shell on OSX with iTerm2 + tmux
set-window-option -g xterm-keys on

# Sets the color of command / message line
set -g message-style fg=white
set -g message-style bg=terminal

# Enable activity alerts (flash the statusline on output)
setw -g monitor-activity on
set -g visual-activity on

set-option -g status on
set-option -g status-interval 2
set-option -g status-justify "centre"
set-option -g status-left-length 60
set-option -g status-right-length 60
set -g status-left '#[fg=#586e75,bg=#ddc57d] TMUX '
set -g status-right '%H:%M '

setw -g status-style "bg=#efe9d5"
setw -g window-status-style fg=colour240
setw -g window-status-current-style "bg=#ddc57d,fg=#586e75"
setw -g window-status-activity-style "bg=white,fg=#b58900"

set -g message-style fg=black,bg=7

# Claude Code agent state, set per window by ~/dotfiles/.tmux/agent-state.sh hooks.
# Waiting for input: soft Solarized red tab. Done: soft Solarized green tab on
# other windows. Working: trailing ellipsis.
set -g @agent_style "#{?#{==:#{@agent_state},waiting},#[bg=#ee9e92]#[fg=#586e75]#[bold],#{?#{==:#{@agent_state},done},#{?window_active,,#[bg=#c7cc7d]#[fg=#586e75]#[bold]},}}"
set -g @agent_glyph "#{?#{==:#{@agent_state},waiting}, ●,#{?#{==:#{@agent_state},done}, ✓,#{?#{==:#{@agent_state},working}, …,}}}"
# Name tabs after the project or worktree directory, cut to 15 characters.
# Worktrees named <project>.<worktree> only show the worktree part.
set -g @tab_name "#{=/15/…:#{s/^[^.]+[.]//:#{b:pane_current_path}}}"
setw -g window-status-format "#{E:@agent_style} #{E:@tab_name}#F#{E:@agent_glyph} "
setw -g window-status-current-format "#{E:@agent_style} #{E:@tab_name}#F#{E:@agent_glyph} "

# A finished agent counts as seen once you visit its window
# (also fires for mouse clicks, which use switch-client, not select-window)
set-hook -g session-window-changed 'if -F "#{==:#{@agent_state},done}" "set -wu @agent_state"'
